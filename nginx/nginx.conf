events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    # Gzip Compression (reduces payload bandwidth by 60%-80%)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    upstream django_upstream {
        server web1:8011;
        server web2:8012;
        server web3:8013;
    }

    upstream frontend_upstream {
        server medihub_frontend:5173;
    }

    # ── Development: proxy to Vite dev server ──
    server {
        listen 80;
        server_name localhost mrtech.company www.mrtech.company _;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        location /api/ {
            proxy_pass http://django_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://django_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/(authentication|profiles|posts|blogs|location|doctors|donors|ambulances|pharmacies|diagnostics|swagger|sitemap\.xml|robots\.txt) {
            proxy_pass http://django_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_intercept_errors on;
            error_page 404 = @frontend_fallback;
        }

        location @frontend_fallback {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $http_host;
        }
    }

    # ── Production: serve built React dist/ files ──
    # Swap to this server block when you run `npm run build`
    # and mount the dist/ folder into nginx instead of using Vite dev server.
    #
    # server {
    #     listen 80;
    #     server_name localhost mrtech.company www.mrtech.company _;
    #
    #     root /app/frontend/dist;
    #     index index.html;
    #
    #     location /static/ { alias /app/staticfiles/; try_files $uri =404; }
    #     location /media/  { alias /app/media/;       try_files $uri =404; }
    #
    #     location /api/ {
    #         proxy_pass http://django_upstream;
    #         proxy_set_header Host $http_host;
    #     }
    #     location /admin/ {
    #         proxy_pass http://django_upstream;
    #         proxy_set_header Host $http_host;
    #     }
    #     location ~ ^/(authentication|profiles|posts|blogs|location|doctors|donors|ambulances|pharmacies|diagnostics|swagger)/ {
    #         proxy_pass http://django_upstream;
    #         proxy_set_header Host $http_host;
    #     }
    #
    #     location / {
    #         try_files $uri $uri/ /index.html;
    #     }
    # }
}
